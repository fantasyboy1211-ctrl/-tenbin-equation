<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>天秤で学ぶ 等式の性質</title>
<style>
  :root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --sub:#6b7280;
    --line:#d1d5db;
    --accent:#2563eb;
    --x:#f59e0b;
    --one:#10b981;
    --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{max-width:1100px;margin:auto;padding:20px}
  h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}
  .lead{margin:0 0 16px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}
  .card{
    background:var(--card);
    border-radius:18px;
    padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.07);
  }
  .equation{
    text-align:center;
    font-size:clamp(28px,5vw,48px);
    font-weight:800;
    margin:8px 0 18px;
  }
  .balance-area{
    min-height:390px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .balance{
    position:relative;
    width:min(760px,95%);
    height:330px;
  }
  .beam{
    position:absolute;
    left:15%;
    top:115px;
    width:70%;
    height:12px;
    background:#4b5563;
    border-radius:10px;
    transform-origin:center;
    transition:transform .6s ease;
  }
  .pivot{
    position:absolute;
    left:50%;
    top:125px;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:45px solid transparent;
    border-right:45px solid transparent;
    border-bottom:130px solid #6b7280;
  }
  .pivot:after{
    content:"";
    position:absolute;
    width:28px;height:28px;
    border-radius:50%;
    background:#374151;
    left:-14px;top:-15px;
  }
  .hanger{
    position:absolute;
    top:6px;
    width:2px;
    height:118px;
    background:#6b7280;
  }
  .hanger.left{left:0}
  .hanger.right{right:0}
  .pan{
    position:absolute;
    top:112px;
    width:250px;
    min-height:115px;
    padding:10px;
    border:4px solid #6b7280;
    border-top:none;
    border-radius:0 0 60px 60px;
    background:#f9fafb;
    display:flex;
    align-content:flex-start;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
  }
  .pan.left{left:-124px}
  .pan.right{right:-124px}
  .weight{
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:white;
    user-select:none;
  }
  .weight.x{
    width:52px;height:52px;
    border-radius:10px;
    background:var(--x);
    font-size:24px;
  }
  .weight.one{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--one);
    font-size:16px;
  }
  .side-label{
    position:absolute;
    top:242px;
    font-weight:800;
    width:250px;
    text-align:center;
  }
  .side-label.left{left:-124px}
  .side-label.right{right:-124px}
  .status{
    text-align:center;
    font-weight:800;
    font-size:18px;
    margin-top:12px;
    min-height:28px;
  }
  .ok{color:#047857}
  .ng{color:#b91c1c}
  .controls h2,.side h2{font-size:18px;margin:8px 0 10px}
  .btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  button{
    border:none;
    border-radius:12px;
    padding:12px 10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    background:#e5e7eb;
    color:#111827;
  }
  button:hover{filter:brightness(.97)}
  button.primary{background:var(--accent);color:white}
  button.warn{background:#fee2e2;color:#991b1b}
  button:disabled{opacity:.4;cursor:not-allowed}
  .note{
    padding:12px;
    background:#eff6ff;
    border-left:5px solid var(--accent);
    border-radius:10px;
    line-height:1.6;
    margin-top:12px;
  }
  .history{
    max-height:260px;
    overflow:auto;
    padding-left:20px;
    line-height:1.8;
  }
  .mini{font-size:13px;color:var(--sub);line-height:1.6}
  .answer{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#ecfdf5;
    font-weight:800;
    text-align:center;
    display:none;
  }
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .toolbar button{flex:1;min-width:130px}
  @media(max-width:820px){
    .grid{grid-template-columns:1fr}
    .balance{transform:scale(.86)}
  }
  @media(max-width:560px){
    .balance{transform:scale(.68)}
    .balance-area{min-height:300px}
    .btns{grid-template-columns:1fr}
  }
</style>

<style>
/* iPad横向き授業用レイアウト */
html, body { min-width: 0; }
body { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
button, input { -webkit-tap-highlight-color: transparent; }
button { min-height: 48px; }
input { min-height: 48px; }

/* 1024×768程度のiPad横向きを想定 */
@media (orientation: landscape) and (min-width: 800px) and (max-width: 1200px) {
  .wrap {
    max-width: none;
    width: 100%;
    padding: 12px 14px;
  }
  h1 {
    font-size: 27px;
    margin-bottom: 2px;
  }
  .lead {
    font-size: 14px;
    margin-bottom: 8px;
  }
  .grid {
    grid-template-columns: minmax(0, 1.55fr) minmax(320px, .75fr);
    gap: 10px;
  }
  .card {
    padding: 12px;
    border-radius: 14px;
  }
  .equation {
    font-size: 34px;
    margin: 2px 0 6px;
  }
  .balance-area {
    min-height: 335px;
    height: 335px;
    padding-top: 0;
    overflow: visible;
  }
  .balance {
    width: min(700px, 92%);
    height: 300px;
    transform: scale(.82);
    transform-origin: center top;
  }
  .status {
    margin-top: 14px;
    min-height: 28px;
  }
  .controls h2, .side h2 {
    font-size: 16px;
    margin: 5px 0 7px;
  }
  .btns {
    gap: 6px;
  }
  .btns button {
    padding: 8px 6px;
    min-height: 45px;
    font-size: 14px;
  }
  .note {
    font-size: 13px;
    line-height: 1.45;
    margin-top: 7px;
    padding: 8px;
  }
  .toolbar {
    gap: 6px;
    margin-top: 7px;
  }
  .toolbar button {
    min-width: 0;
    min-height: 44px;
    padding: 8px 5px;
    font-size: 13px;
  }
  .history {
    max-height: 90px;
    margin: 4px 0;
    font-size: 13px;
    line-height: 1.5;
  }
  .mini {
    font-size: 11px;
  }
  #problemInput {
    min-height: 44px !important;
    font-size: 17px !important;
  }
}

/* iPad Pro等の大きめ横画面 */
@media (orientation: landscape) and (min-width: 1201px) {
  .wrap { max-width: 1280px; }
}

/* タブレット縦向きでは無理に横レイアウトにしない */
@media (orientation: portrait) and (min-width: 700px) {
  .wrap { padding: 16px; }
  .grid { grid-template-columns: 1fr; }
}

/* Safe Area */
@supports (padding: max(0px)) {
  .wrap {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
}
</style>

</head>
<body>
<div class="wrap">
  <h1>⚖️ 天秤で学ぶ「等式の性質」</h1>
  <p class="lead">両辺に同じことをすると、つり合いはどうなるだろう？</p>

  <div class="grid">
    <section class="card">
      <div id="equation" class="equation"></div>

      <div class="balance-area">
        <div class="balance">
          <div id="beam" class="beam">
            <div class="hanger left"></div>
            <div class="hanger right"></div>
            <div id="leftPan" class="pan left"></div>
            <div id="rightPan" class="pan right"></div>
            <div id="leftLabel" class="side-label left"></div>
            <div id="rightLabel" class="side-label right"></div>
          </div>
          <div class="pivot"></div>
        </div>
      </div>

      <div id="status" class="status"></div>
    </section>

    <aside class="card side">
      <h2>問題を指定</h2>
      <div style="background:#f9fafb;padding:12px;border-radius:12px;margin-bottom:12px;">
        <div style="font-size:14px;color:#6b7280;margin-bottom:6px;">
          「ax + b = c」の形で入力してください
        </div>
        <input id="problemInput" type="text" value="3x + 5 = 17"
               placeholder="例：3x + 5 = 17"
               style="width:100%;padding:11px;border:2px solid #d1d5db;border-radius:9px;font-size:18px;">
        <button class="primary" onclick="setCustomProblem()"
                style="width:100%;margin-top:8px;">この問題を設定</button>
        <div class="mini" style="margin-top:7px;">
          例：3x=12、5x+2=17、2x−4=10 など
        </div>
      </div>

      <h2>① 両辺に同じ操作</h2>
      <div class="btns">
        <button onclick="bothConst(1)">両辺に +1</button>
        <button onclick="bothConst(-1)">両辺から −1</button>
        <button onclick="bothX(1)">両辺に +x</button>
        <button onclick="bothX(-1)">両辺から −x</button>
        <button onclick="multiply(2)">両辺を ×2</button>
        <button onclick="divide(2)">両辺を ÷2</button>
        <div style="grid-column:1 / -1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#f9fafb;padding:10px;border-radius:12px;">
          <label for="divideNum" style="font-weight:700;">わる数：</label>
          <input id="divideNum" type="number" min="1" step="1" value="3"
                 style="width:80px;padding:9px;border:2px solid #d1d5db;border-radius:9px;font-size:16px;">
          <button class="primary" onclick="divideSpecified()" style="flex:1;">両辺を指定した数でわる</button>
        </div>
      </div>

      <h2>② 片方だけ動かして実験</h2>
      <div class="btns">
        <button class="warn" onclick="oneSide('L',1)">左辺だけ +1</button>
        <button class="warn" onclick="oneSide('R',1)">右辺だけ +1</button>
        <button class="warn" onclick="oneSide('L',-1)">左辺だけ −1</button>
        <button class="warn" onclick="oneSide('R',-1)">右辺だけ −1</button>
      </div>

      <div class="note">
        <strong>ポイント</strong><br>
        等式では、<b>両辺に同じ数をたす・ひく・かける</b>、または
        <b>同じ0でない数でわる</b>と、等式は成り立ったままです。
      </div>

      <div class="toolbar">
        <button class="primary" onclick="newProblem()">ランダム問題</button>
        <button onclick="resetProblem()">最初に戻す</button>
        <button onclick="showAnswer()">答えを見る</button>
      </div>

      <div id="answer" class="answer"></div>

      <h2>操作の記録</h2>
      <ol id="history" class="history"></ol>
      <p class="mini">※ オレンジの四角が「x」、緑の丸が「1」を表します。</p>
    </aside>
  </div>
</div>

<script>
let initial = null;
let state = null;
let solution = 3;

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function expr(a,b){
  let s = "";
  if(a !== 0){
    if(a === 1) s = "x";
    else if(a === -1) s = "−x";
    else s = `${a}x`;
  }
  if(b !== 0){
    if(s){
      s += b > 0 ? ` + ${b}` : ` − ${Math.abs(b)}`;
    }else{
      s = `${b}`;
    }
  }
  return s || "0";
}


function parseTerm(s){
  s = s.trim().replace(/−/g, "-").replace(/－/g, "-").replace(/\s+/g, "");
  if(s === "") return {a:0,b:0};

  let a = 0, b = 0;

  // x を含む項
  const xMatch = s.match(/^([+-]?\d*)x$/i);
  if(xMatch){
    let coef = xMatch[1];
    if(coef === "" || coef === "+") a = 1;
    else if(coef === "-") a = -1;
    else a = Number(coef);
    return {a:a,b:0};
  }

  // 数字だけ
  if(/^[+-]?\d+$/.test(s)) return {a:0,b:Number(s)};

  // ax+b / ax-b
  const parts = s.match(/^([+-]?\d*)x([+-]\d+)$/i);
  if(parts){
    let coef = parts[1];
    if(coef === "" || coef === "+") a = 1;
    else if(coef === "-") a = -1;
    else a = Number(coef);
    b = Number(parts[2]);
    return {a:a,b:b};
  }

  throw new Error("式を読み取れません");
}

function setCustomProblem(){
  const input = document.getElementById("problemInput");
  const raw = input.value.trim();

  try{
    const sides = raw.split("=");
    if(sides.length !== 2) throw new Error("＝が必要です");

    const L = parseTerm(sides[0]);
    const R = parseTerm(sides[1]);

    if(!Number.isInteger(L.a) || !Number.isInteger(L.b) ||
       !Number.isInteger(R.a) || !Number.isInteger(R.b)){
      throw new Error("整数で入力してください");
    }

    // 一次方程式として解を求める
    const denom = L.a - R.a;
    const numer = R.b - L.b;

    if(denom === 0){
      if(numer === 0) throw new Error("すべてのxで成り立つ等式です");
      throw new Error("この問題には解がありません");
    }

    solution = numer / denom;

    initial = {
      la:L.a, lb:L.b,
      ra:R.a, rb:R.b
    };
    state = clone(initial);

    document.getElementById("history").innerHTML = "";
    document.getElementById("answer").style.display = "none";
    render();

  }catch(e){
    alert("問題を設定できません。\n\n「3x + 5 = 17」のような形で入力してください。");
  }
}

function newProblem(){
  // 中1で扱いやすい ax+b=c 型、係数は2〜5、解は1〜5
  solution = Math.floor(Math.random()*5)+1;
  const a = Math.floor(Math.random()*4)+2;     // 2〜5
  const b = Math.floor(Math.random()*5)+1;     // 1〜5
  const c = a*solution+b;
  initial = {la:a, lb:b, ra:0, rb:c};
  state = clone(initial);
  document.getElementById("problemInput").value = `${a}x + ${b} = ${c}`;
  document.getElementById("history").innerHTML = "";
  document.getElementById("answer").style.display = "none";
  render();
}

function resetProblem(){
  state = clone(initial);
  document.getElementById("history").innerHTML = "";
  document.getElementById("answer").style.display = "none";
  render();
}

function addHistory(text){
  const li = document.createElement("li");
  li.textContent = text;
  document.getElementById("history").appendChild(li);
}

function bothConst(n){
  state.lb += n;
  state.rb += n;
  addHistory(n>0 ? `両辺に ${n} をたした` : `両辺から ${Math.abs(n)} をひいた`);
  render();
}

function bothX(n){
  state.la += n;
  state.ra += n;
  addHistory(n>0 ? "両辺に x をたした" : "両辺から x をひいた");
  render();
}

function multiply(n){
  state.la *= n; state.lb *= n;
  state.ra *= n; state.rb *= n;
  addHistory(`両辺を ${n} 倍した`);
  render();
}

function divide(n){
  // 係数・定数をすべて整数のまま扱える場合に実行
  if(Number.isInteger(n) && n > 0 &&
     [state.la,state.lb,state.ra,state.rb].every(v => v % n === 0)){
    state.la /= n; state.lb /= n;
    state.ra /= n; state.rb /= n;
    addHistory(`両辺を ${n} でわった`);
    render();
  }else{
    alert("今はすべての項を割り切れる数を指定してください。");
  }
}

function divideSpecified(){
  const input = document.getElementById("divideNum");
  const n = Number(input.value);

  if(!Number.isInteger(n) || n <= 0){
    alert("1以上の整数を入力してください。");
    input.focus();
    return;
  }

  divide(n);
}

function oneSide(side,n){
  if(side==="L") state.lb += n;
  else state.rb += n;
  addHistory(`${side==="L"?"左辺":"右辺"}だけ ${n>0?"+":"−"}${Math.abs(n)}`);
  render();
}

function value(a,b){ return a*solution+b; }

function makeWeights(el,a,b){
  el.innerHTML="";
  // 負の個数になった場合は、簡易的に式だけを表示
  if(a < 0 || b < 0){
    const msg=document.createElement("div");
    msg.style.padding="20px";
    msg.style.fontWeight="800";
    msg.textContent="（負の重りを含む）";
    el.appendChild(msg);
    return;
  }
  for(let i=0;i<a;i++){
    const d=document.createElement("div");
    d.className="weight x"; d.textContent="x"; el.appendChild(d);
  }
  for(let i=0;i<b;i++){
    const d=document.createElement("div");
    d.className="weight one"; d.textContent="1"; el.appendChild(d);
  }
}

function render(){
  const leftText=expr(state.la,state.lb);
  const rightText=expr(state.ra,state.rb);
  document.getElementById("equation").textContent=`${leftText} = ${rightText}`;
  document.getElementById("leftLabel").textContent=`左辺：${leftText}`;
  document.getElementById("rightLabel").textContent=`右辺：${rightText}`;

  makeWeights(document.getElementById("leftPan"),state.la,state.lb);
  makeWeights(document.getElementById("rightPan"),state.ra,state.rb);

  const lv=value(state.la,state.lb);
  const rv=value(state.ra,state.rb);
  const diff=lv-rv;

  // 左が重ければ左下がり、右が重ければ右下がり
  const angle=Math.max(-10,Math.min(10,diff*2));
  document.getElementById("beam").style.transform=`rotate(${-angle}deg)`;

  const status=document.getElementById("status");
  if(Math.abs(diff)<1e-9){
    status.className="status ok";
    status.textContent="✅ つり合っている！ 等式は成り立っている";
  }else{
    status.className="status ng";
    status.textContent="⚠️ つり合いがくずれた！ 左右に同じ操作をしよう";
  }
}

function showAnswer(){
  const box=document.getElementById("answer");
  box.style.display="block";
  box.textContent=`この問題の答えは x = ${solution}`;
}

newProblem();
</script>
</body>
</html>
